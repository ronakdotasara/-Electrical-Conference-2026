<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMT Acknowledgement</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Arial", sans-serif;
      background-color: #ffffff;
      color: #000000;
    }

    /* Top bar */
    .navbar {
      width: 100%;
      padding: 16px 40px;
      border-bottom: 1px solid #e0e0e0;
      background-color: #650f13;
      display: flex;
      align-items: center;
    }

    /* Home button */
    .home-btn {
      text-decoration: none;
      color: #ffffff;
      background-color: #0b5ed7;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }

    .home-btn:hover {
      background-color: #084298;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.7;
      font-size: 16px;
      text-align: center;
    }

    /* Logo */
    .logo {
      max-width: 220px;
      margin-bottom: 30px;
      cursor: pointer;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 24px;
      font-weight: 600;
    }

    p {
      text-align: justify;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <a href="https://www.pics2026nith.com/" class="home-btn">Home</a>
  </div>

  <div class="container">

    <!-- Clickable Logo -->
    <a href="https://www.pics2026nith.com/">
      <img
        src="PICSLOGO.png"
        alt="PICS Springer Logo"
        class="logo"
      />
    </a>

    <h1>CMT Acknowledgement</h1>

    <p>
      The Microsoft CMT service was used for managing the peer-reviewing process
      for this conference. This service was provided for free by Microsoft and
      they bore all expenses, including costs for Azure cloud services as well
      as for software development and support.
    </p>
  </div>

</body>
</html>
